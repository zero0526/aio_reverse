[project]
name = "aio-sidecar"
version = "0.1.0"
description = "Python SDK for aio_reverse sidecar engines speaking wire protocol v1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["wre-runtime>=3.1.1"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
wre-runtime = { path = "../../libs/web-re-toolkit/packages/python", editable = true }
